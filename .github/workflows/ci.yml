name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  governance:
    name: governance / dev-std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync --all-extras --python 3.14 --locked
      - name: Run dev-std governance audit
        run: uv run --python 3.14 dev-std audit .

  test:
    name: ${{ matrix.os }} / Python 3.14
    needs: governance
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Verify Node toolchain
        run: node --version && npm --version
      - name: Sync
        run: uv sync --all-extras --python 3.14 --locked
      - name: Run Rack signoff
        run: uv run --python 3.14 rack run --all
      - name: Build package
        run: uv run --python 3.14 python -m build
      - name: Check package
        run: uv run --python 3.14 twine check dist/*
      - name: Installed wheel smoke test
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist -Filter "*.whl" | Select-Object -First 1
          uv tool install --python 3.14 --force $wheel.FullName
          $installedCli = (Get-Command wn-dev-std).Source
          wn-dev-std --version
          wn-dev-std standard
          uv run --python 3.14 python tests/support_scripts/installed_wheel_template_smoke.py dist $installedCli
