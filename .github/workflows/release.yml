name: Release Validation

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.13.4"
      - name: Refresh Linux CA certificates
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Verify Node toolchain
        run: node --version && npm --version
      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(uv run --python 3.14 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
      - name: Verify release notes mention package version
        shell: bash
        run: |
          VERSION="$(uv run --python 3.14 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          RELEASE_DATE="$(uv run --python 3.14 python -c 'import tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; y,m,d,*_=map(int,v.split(".")); print(f"{y:04d}-{m:02d}-{d:02d}")')"
          grep -F "## ${VERSION}" CHANGELOG.md
          test -f "docs/releases/${RELEASE_DATE}.md"
          grep -F "\`${VERSION}\`" "docs/releases/${RELEASE_DATE}.md"
      - name: Sync
        run: uv sync --all-extras --python 3.14 --locked
      - name: Run dev-std governance audit
        run: uv run --python 3.14 dev-std audit .
      - name: Run Rack signoff
        run: uv run --python 3.14 rack run --all
      - name: Build package
        run: uv run --python 3.14 python -m build --installer uv
      - name: Check package
        run: uv run --python 3.14 twine check dist/*
      - name: Installed wheel smoke test
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist -Filter "*.whl" | Select-Object -First 1
          uv tool install --python 3.14 --force $wheel.FullName
          $installedCli = (Get-Command wn-dev-std).Source
          wn-dev-std --version
          wn-dev-std check .
          uv run --python 3.14 python tests/support_scripts/installed_wheel_template_smoke.py dist $installedCli
      - name: Publish package
        run: uv publish --trusted-publishing always
