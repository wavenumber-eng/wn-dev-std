# Source of truth: docs/design/rust-standard.html.
# Regeneration: copy this template and set paths.source_roots to all owned Rust roots.
# Release inclusion: committed project policy; ratchet baselines are committed separately.
schema = 1
mode = "strict"

[limits]
max_parameters = 7
max_function_lines = 100
max_test_function_lines = 150
max_file_lines = 1000
max_cyclomatic_complexity = 10
max_nesting = 4

[paths]
source_roots = ["src", "tests"]
exclude_parts = [
  ".git",
  "_build",
  "bindings",
  "build",
  "generated",
  "node_modules",
  "target",
  "third_party",
  "vendor",
]

# Every exception must match a current violation. Unmatched entries fail as stale.
# [[exceptions]]
# id = "ffi-callback-v1"
# path = "src/ffi/callback.rs"
# item = "Callback::invoke"
# rule = "max_parameters"
# max_value = 8
# reason = "The reviewed C ABI fixes the callback signature."
# review_trigger = "Remove when ABI v2 becomes the minimum supported version."
